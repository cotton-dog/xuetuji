<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信 WeChat</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Helvetica Neue\", sans-serif;
            background-color: #000;
        }

        /* 全屏背景图容器 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('https://i.imgs.ovh/2026/05/21/57e6b7c2239da21d46d9436512499458.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            /* 严格控制整体底部抬高距离，让按钮高度贴近原图 */
            padding-bottom: 95px; 
            /* 【精细修复】：顶部增加 44px 留白，完美显露桌面状态栏，绝不撞车和挤压 */
            padding-top: 44px;
        }

        /* ==================== 【已修复】：移除原本冲突的状态栏 ==================== */

        /* 底部双按钮并排外框 */
        .btn-group {
            display: flex;
            /* 左右按钮之间的精确间隙 */
            gap: 32px; 
        }

        /* 按钮精确调校 */
        .btn {
            /* 彻底砍掉宽度！固定成原图那种精巧的小短块 */
            width: 120px; 
            height: 48px; 
            border: none;
            /* 极小的微圆角 */
            border-radius: 6px; 
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            text-indent: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.1s ease;
        }

        .btn:active {
            opacity: 0.8;
        }

        /* 微信绿 */
        .btn-login {
            background-color: #07C160;
            color: #FFFFFF;
        }

        /* 纯白 */
        .btn-register {
            background-color: #FFFFFF;
            color: #191919;
        }

        /* ==================== 【已修复】：干掉原本冲突的底部系统黑线 ==================== */
    </style>
</head>
<body>

    <div class="container">
        <div class="btn-group">
            <button class="btn btn-login">登录</button>
            <button class="btn btn-register">注册</button>
        </div>
    </div>

    <script>
        const container = document.querySelector('.container');
        
        let startX = 0;
        let startY = 0;
        let isMoving = false;
        let swipeDirection = null; 

        function handleStart(e) {
            const touch = e.touches ? e.touches[0] : e;
            startX = touch.clientX;
            startY = touch.clientY;
            isMoving = true;
            swipeDirection = null;
            container.style.transition = 'none'; 
        }

        function handleMove(e) {
            if (!isMoving) return;
            const touch = e.touches ? e.touches[0] : e;
            let deltaX = touch.clientX - startX;
            let deltaY = touch.clientY - startY;

            if (!swipeDirection) {
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 8) {
                    swipeDirection = deltaX > 0 ? 'left-to-right' : 'right-to-left';
                } else if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 8) {
                    isMoving = false; 
                }
            }

            if (swipeDirection === 'left-to-right' && deltaX > 0) {
                container.style.transform = `translateX(${deltaX}px) scale(${1 - deltaX/3000})`;
                container.style.opacity = `${1 - deltaX/1000}`;
            } else if (swipeDirection === 'right-to-left' && deltaX < 0) {
                container.style.transform = `translateX(${deltaX}px) scale(${1 - Math.abs(deltaX)/3000})`;
                container.style.opacity = `${1 - Math.abs(deltaX)/1000}`;
            }
        }

        function handleEnd(e) {
            if (!isMoving) return;
            isMoving = false;

            const touch = e.changedTouches ? e.changedTouches[0] : e;
            let deltaX = touch.clientX - startX;
            const triggerDistance = window.innerWidth * 0.35; 

            container.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease';

            // 侧滑成功时，安全地通知外部桌面关闭，绝不刷新加载
            if (swipeDirection === 'left-to-right' && deltaX > triggerDistance) {
                container.style.transform = 'translateX(100%)';
                container.style.opacity = '0';
                setTimeout(() => {
                    window.parent.postMessage('closeApp', '*');
                    setTimeout(() => { container.style.transform = 'translateX(0)'; container.style.opacity = '1'; }, 100);
                }, 300);
            } else if (swipeDirection === 'right-to-left' && Math.abs(deltaX) > triggerDistance) {
                container.style.transform = 'translateX(-100%)';
                container.style.opacity = '0';
                setTimeout(() => {
                    window.parent.postMessage('closeApp', '*');
                    setTimeout(() => { container.style.transform = 'translateX(0)'; container.style.opacity = '1'; }, 100);
                }, 300);
            } else {
                container.style.transform = 'translateX(0px) scale(1)';
                container.style.opacity = '1';
            }
        }

        window.addEventListener('touchstart', handleStart, { passive: true });
        window.addEventListener('touchmove', handleMove, { passive: true });
        window.addEventListener('touchend', handleEnd);

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
    </script>
</body>
</html>
