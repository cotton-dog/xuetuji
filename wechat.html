<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信 WeChat</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #000;
        }

        /* 全屏背景图容器 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('https://i.imgs.ovh/2026/05/21/57e6b7c2239da21d46d9436512499458.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            /* 严格控制整体底部抬高距离，让按钮高度贴近原图 */
            padding-bottom: calc(32px + env(safe-area-inset-bottom));
            will-change: transform, opacity; /* 增加物理硬件加速，保证上滑丝滑 */
        }

        /* 右上角语言按钮 */
        .lang-btn {
            position: absolute;
            top: calc(24px + env(safe-area-inset-top));
            right: 24px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }

        /* 底部按钮外层：让它们各执一端，死贴两侧 */
        .button-group {
            width: 100%;
            /* 缩减两侧边距，让按钮像原图一样极度贴边 */
            padding: 0 20px; 
            display: flex;
            justify-content: space-between;
        }

        /* 按钮精确调校 */
        .btn {
            /* 彻底砍掉宽度！固定成原图那种精巧的小短块 */
            width: 120px; 
            height: 48px; 
            border: none;
            /* 极小的微圆角 */
            border-radius: 6px; 
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            text-indent: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.1s ease;
        }

        .btn:active {
            opacity: 0.8;
        }

        /* 微信绿 */
        .btn-login {
            background-color: #07C160;
            color: #FFFFFF;
        }

        /* 纯白 */
        .btn-register {
            background-color: #FFFFFF;
            color: #191919;
        }

        /* 【已删除】原先丑陋的 .home-indicator 系统黑杠已经彻底拔除，改用全隐形手势控制 */
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <div class="lang-btn">语言</div>

        <div class="button-group">
            <button class="btn btn-login">登录</button>
            <button class="btn btn-register">注册</button>
        </div>
    </div>

    <script>
        const appContainer = document.getElementById('appContainer');
        
        let startX = 0;
        let startY = 0;
        let isHomeSwiping = false;

        function handleTouchStart(e) {
            const touch = e.touches ? e.touches[0] : e;
            const windowHeight = window.innerHeight;
            
            // 【安全边界】：只有当手指从屏幕最底部的 45px 区域内往上划时，才激活返回桌面手势
            if (touch.clientY > windowHeight - 45) {
                startX = touch.clientX;
                startY = touch.clientY;
                isHomeSwiping = true;
                appContainer.style.transition = 'none'; 
            }
        }

        function handleTouchMove(e) {
            if (!isHomeSwiping) return;
            const touch = e.touches ? e.touches[0] : e;
            let diffY = touch.clientY - startY;

            // 只有向上滑（diffY为负数）时才产生动画联动
            if (diffY < 0) {
                // 产生由大变小、向上升起的渐隐回弹感，高级感拉满
                let scalePercent = 1 - Math.abs(diffY) / 1200;
                if(scalePercent < 0.85) scalePercent = 0.85;
                appContainer.style.transform = `translateY(${diffY}px) scale(${scalePercent})`;
                appContainer.style.opacity = `${1 - Math.abs(diffY)/500}`;
            }
        }

        function handleTouchEnd(e) {
            if (!isHomeSwiping) return;
            isHomeSwiping = false;

            const touch = e.changedTouches ? e.changedTouches[0] : e;
            let diffY = touch.clientY - startY;

            appContainer.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease';

            // 划动超过 80 像素，直接判定成功回桌面
            if (diffY < -80) {
                appContainer.style.transform = 'translateY(-30%) scale(0.85)';
                appContainer.style.opacity = '0';
                
                setTimeout(() => {
                    // 通知外部主页把这个微信层隐藏，并将状态栏颜色恢复为黑色
                    window.parent.postMessage('closeApp', '*');
                    
                    // 延迟重置样式，等待下一次被重新点开
                    setTimeout(() => {
                        appContainer.style.transform = 'translateY(0) scale(1)';
                        appContainer.style.opacity = '1';
                    }, 350);
                }, 150);
            } else {
                // 划动力度不够，弹回原位
                appContainer.style.transform = 'translateY(0px) scale(1)';
                appContainer.style.opacity = '1';
            }
        }

        window.addEventListener('touchstart', handleTouchStart, { passive: true });
        window.addEventListener('touchmove', handleTouchMove, { passive: true });
        window.addEventListener('touchend', handleTouchEnd);

        window.addEventListener('mousedown', handleTouchStart);
        window.addEventListener('mousemove', handleTouchMove);
        window.addEventListener('mouseup', handleTouchEnd);
    </script>
</body>
</html>
