<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none; 
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #000;
        }

        .status-bar {
            display: none !important; 
        }

        .app-container {
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-top: 44px; 
            will-change: transform, opacity;
        }

        /* 微信头部导航栏 */
        .app-header {
            height: 50px;
            background-color: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            border-bottom: 0.5px solid #222;
        }

        .header-left {
            font-size: 22px;
            font-weight: 600;
            color: #dfdfdf;
        }

        .header-right {
            display: flex;
            gap: 18px;
            font-size: 18px;
            color: #dfdfdf;
        }

        /* 搜索栏区域 */
        .search-container {
            padding: 8px 12px;
            background-color: #111;
        }

        .search-box {
            width: 100%;
            height: 36px;
            background-color: #222;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            color: #777;
            font-size: 15px;
        }

        /* 消息列表区域 */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            background-color: #111;
            -webkit-overflow-scrolling: touch;
        }

        .chat-item {
            display: flex;
            padding: 12px 16px;
            gap: 12px;
            border-bottom: 0.5px solid #1a1a1a;
            cursor: pointer;
        }

        .chat-item:active {
            background-color: #1a1a1a;
        }

        .avatar-wrapper {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            object-fit: cover;
            background-color: #333;
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #fa5151;
            color: white;
            font-size: 11px;
            font-weight: 500;
            padding: 1px 5px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
            border: 1px solid #111;
        }

        .badge-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            background-color: #fa5151;
            border-radius: 50%;
            border: 1px solid #111;
        }

        .chat-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            min-width: 0; 
        }

        .chat-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 500;
            color: #dfdfdf;
        }

        .chat-time {
            font-size: 12px;
            color: #555;
        }

        .chat-row-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-msg {
            font-size: 14px;
            color: #777;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }

        .chat-mute {
            font-size: 12px;
            color: #333;
        }

        /* 底部 Tab 导航栏 */
        .tab-bar {
            height: 58px;
            background-color: #191919;
            border-top: 0.5px solid #222;
            display: flex;
            padding-bottom: 8px; /* 给隐形的手势操作区留出受力空间 */
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
            color: #999;
            cursor: pointer;
            position: relative;
        }

        .tab-item.active {
            color: #07c160; 
        }

        .tab-item i {
            font-size: 20px;
        }

        .tab-item span {
            font-size: 10px;
        }

        .tab-item .badge {
            top: 2px;
            left: 52%;
        }
        .tab-item .badge-dot {
            top: 4px;
            left: 54%;
        }

        /* 【已删除】：原先极丑的黑杠彻底拔除 */
        .home-indicator {
            display: none !important; 
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <div class="app-header">
            <div class="header-left">微信</div>
            <div class="header-right">
                <i class="fas fa-search"></i>
                <i class="fas fa-plus-circle"></i>
            </div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <span>搜索</span>
            </div>
        </div>

        <div class="chat-list">
            
            <div class="chat-item">
                <div class="avatar-wrapper">
                    <img class="avatar" src="https://i.imgs.ovh/2026/05/22/e13fe7bb2a4a3bc6c0cc2e88a38a7bd0.jpg" alt="头像">
                    <div class="badge">1</div>
                </div>
                <div class="chat-details">
                    <div class="chat-row-top">
                        <span class="chat-name">何煜</span>
                        <span class="chat-time">10:25</span>
                    </div>
                    <div class="chat-row-bottom">
                        <span class="chat-msg">听话。</span>
                        <span class="chat-mute"></span>
                    </div>
                </div>
            </div>

            <div class="chat-item">
                <div class="avatar-wrapper">
                    <img class="avatar" src="https://i.imgs.ovh/2026/05/22/a933ff228b3e813f87c95696d744bfa2.jpg" alt="头像">
                </div>
                <div class="chat-details">
                    <div class="chat-row-top">
                        <span class="chat-name">田栎阳</span>
                        <span class="chat-time">09:14</span>
                    </div>
                    <div class="chat-row-bottom">
                        <span class="chat-msg">[图片]</span>
                        <span class="chat-mute"></span>
                    </div>
                </div>
            </div>

            <div class="chat-item">
                <div class="avatar-wrapper">
                    <img class="avatar" src="https://i.imgs.ovh/2026/05/22/33827ec3a1d95ee02bd8b948c2c1fa0e.jpg" alt="头像">
                    <div class="badge-dot"></div>
                </div>
                <div class="chat-details">
                    <div class="chat-row-top">
                        <span class="chat-name">订阅号消息</span>
                        <span class="chat-time">昨天</span>
                    </div>
                    <div class="chat-row-bottom">
                        <span class="chat-msg">一条未读资讯推送...</span>
                        <span class="chat-mute"></span>
                    </div>
                </div>
            </div>

            <div class="chat-item">
                <div class="avatar-wrapper">
                    <img class="avatar" src="https://i.imgs.ovh/2026/05/22/75df0709b4d375369ec2643a6fb98fc3.jpg" alt="头像">
                </div>
                <div class="chat-details">
                    <div class="chat-row-top">
                        <span class="chat-name">微信团队</span>
                        <span class="chat-time">前天</span>
                    </div>
                    <div class="chat-row-bottom">
                        <span class="chat-msg">欢迎使用安全绿色的微信沟通环境。</span>
                        <span class="chat-mute"><i class="fas fa-volume-mute"></i></span>
                    </div>
                </div>
            </div>

        </div>

        <div class="tab-bar">
            <div class="tab-item active">
                <i class="fas fa-comment-alt"></i>
                <span>微信</span>
                <div class="badge">1</div>
            </div>
            <div class="tab-item">
                <i class="far fa-address-book"></i>
                <span>通讯录</span>
            </div>
            <div class="tab-item">
                <i class="far fa-compass"></i>
                <span>发现</span>
                <div class="badge-dot"></div>
            </div>
            <div class="tab-item">
                <i class="far fa-user"></i>
                <span>我</span>
            </div>
        </div>

    </div>

    <script>
        const appContainer = document.getElementById('appContainer');
        
        let startX = 0;
        let startY = 0;
        let isHomeSwiping = false;

        function handleTouchStart(e) {
            const touch = e.touches ? e.touches[0] : e;
            const windowHeight = window.innerHeight;
            
            // 【核心安全判定】：只有当手指从屏幕最底部的 45px 区域内往上划时，才激活返回桌面手势
            if (touch.clientY > windowHeight - 45) {
                startX = touch.clientX;
                startY = touch.clientY;
                isHomeSwiping = true;
                appContainer.style.transition = 'none'; 
            }
        }

        function handleTouchMove(e) {
            if (!isHomeSwiping) return;
            const touch = e.touches ? e.touches[0] : e;
            let diffY = touch.clientY - startY;

            // 只有向上滑（diffY为负数）时才产生动画联动
            if (diffY < 0) {
                // 产生由大变小、向上升起的渐隐回弹感，高级感拉满
                let scalePercent = 1 - Math.abs(diffY) / 1200;
                if(scalePercent < 0.85) scalePercent = 0.85;
                appContainer.style.transform = `translateY(${diffY}px) scale(${scalePercent})`;
                appContainer.style.opacity = `${1 - Math.abs(diffY)/500}`;
            }
        }

        function handleTouchEnd(e) {
            if (!isHomeSwiping) return;
            isHomeSwiping = false;

            const touch = e.changedTouches ? e.changedTouches[0] : e;
            let diffY = touch.clientY - startY;

            appContainer.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease';

            // 划动超过 80 像素，直接判定成功回桌面
            if (diffY < -80) {
                // 向上化为虚无
                appContainer.style.transform = 'translateY(-30%) scale(0.85)';
                appContainer.style.opacity = '0';
                
                setTimeout(() => {
                    // 通知父级桌面把这个 iframe 沉下去、并把状态栏恢复为黑色字
                    window.parent.postMessage('closeApp', '*');
                    
                    // 无缝重置容器状态，等待下一次被点开
                    setTimeout(() => {
                        appContainer.style.transform = 'translateY(0) scale(1)';
                        appContainer.style.opacity = '1';
                    }, 350);
                }, 150);
            } else {
                // 划动力度不够，弹回原位
                appContainer.style.transform = 'translateY(0px) scale(1)';
                appContainer.style.opacity = '1';
            }
        }

        window.addEventListener('touchstart', handleTouchStart, { passive: true });
        window.addEventListener('touchmove', handleTouchMove, { passive: true });
        window.addEventListener('touchend', handleTouchEnd);

        window.addEventListener('mousedown', handleTouchStart);
        window.addEventListener('mousemove', handleTouchMove);
        window.addEventListener('mouseup', handleTouchEnd);
    </script>
</body>
</html>
