<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信 WeChat</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #000;
        }

        /* 全屏背景图容器 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            /* 1. 已经为你更换了全新的背景图片链接 */
            background-image: url('https://i.imgs.ovh/2026/05/22/ac09fe9be2e85954c2cb4e3d5fb2d4c7.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            /* 严格控制整体底部抬高距离，让按钮高度贴近原图 */
            padding-bottom: calc(32px + env(safe-area-inset-bottom));
            
            /* 强制全屏覆盖，不给顶部留一丝缝隙，彻底解决白色横线问题 */
            margin-top: 0;
            border: none;
        }

        /* 右上角语言按钮 */
        .lang-btn {
            position: absolute;
            top: calc(24px + env(safe-area-inset-top));
            right: 24px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }

        /* 底部按钮外层：让它们各执一端，死贴两侧 */
        .button-group {
            width: 100%;
            /* 缩减两侧边距，让按钮像原图一样极度贴边 */
            padding: 0 20px; 
            display: flex;
            justify-content: space-between;
        }

        /* 按钮精确调校 */
        .btn {
            /* 彻底砍掉宽度！固定成原图那种精巧的小短块 */
            width: 120px; 
            height: 48px; 
            border: none;
            /* 极小的微圆角 */
            border-radius: 6px; 
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            text-indent: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.1s ease;
        }

        .btn:active {
            opacity: 0.8;
        }

        /* 微信绿 */
        .btn-login {
            background-color: #07C160;
            color: #FFFFFF;
        }

        /* 纯白 */
        .btn-register {
            background-color: #FFFFFF;
            color: #191919;
        }

        /* 2. 【已按要求删除】：原先极丑的系统底部白杠 `.home-indicator` 已被彻底拔除，干净清爽 */
    </style>
</head>
<body>

    <div class="container">
        <div class="lang-btn">语言</div>

        <div class="button-group">
            <button class="btn btn-login">登录</button>
            <button class="btn btn-register">注册</button>
        </div>
    </div>

    <script>
        let edgeStartX = 0;
        let edgeStartY = 0;
        let isRightEdgeSwiping = false;

        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const screenWidth = window.innerWidth;
            
            // 判定手指是否落在屏幕最右侧边缘（靠右 40px 内的范围）
            if (touch.clientX > screenWidth - 40) {
                edgeStartX = touch.clientX;
                edgeStartY = touch.clientY;
                isRightEdgeSwiping = true;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isRightEdgeSwiping) return;
            
            const touch = e.touches[0];
            const deltaX = touch.clientX - edgeStartX;
            const deltaY = touch.clientY - edgeStartY;

            // 如果上下滑动的位移过大，说明用户不是在做侧滑，及时拦截释放
            if (Math.abs(deltaY) > Math.abs(deltaX)) {
                isRightEdgeSwiping = false;
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!isRightEdgeSwiping) return;
            isRightEdgeSwiping = false;

            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - edgeStartX;

            // 从右往左划，deltaX 是个负数。当向左拉动超过 60 像素时，判定返回成功！
            if (deltaX < -60) {
                // 向外层的桌面大框架发出返回通知，安全且不误触
                window.parent.postMessage('closeWechat', '*');
            }
        });
    </script>

</body>
</html>
