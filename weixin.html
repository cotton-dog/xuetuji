<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* 仿iOS，禁止长按选中文本 */
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #000;
        }

        /* ==================== 🛠️ 新增：完全同步主屏幕的 iOS 状态栏 ==================== */
        .status-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #FFF; /* 微信地球背景为暗色，状态栏文字设为纯白 */
            font-size: 14px;
            font-weight: 590;          
            z-index: 100; 
            pointer-events: none; 
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .battery-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .battery-icon {
            width: 25px;
            height: 12px;
            border: 1px solid #FFF; /* 适配白字 */
            border-radius: 3px;
            position: relative;
            padding: 1px;
        }

        .battery-level {
            height: 100%;
            background-color: #FFF; /* 适配白字 */
            border-radius: 1px;
            transition: width 0.3s ease;
        }

        .battery-tip {
            width: 2px;
            height: 4px;
            background-color: #FFF; /* 适配白字 */
            border-radius: 0 1px 1px 0;
        }

        /* ==================== 📲 完好保留：全屏背景图容器 (加入返回动画支撑) ==================== */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('https://i.imgs.ovh/2026/05/21/57e6b7c2239da21d46d9436512499458.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            /* 严格控制整体底部抬高距离，让按钮高度贴近原图 */
            padding-bottom: calc(32px + env(safe-area-inset-bottom));
            
            /* 用于滑动返回的性能加速与过渡 */
            will-change: transform, opacity;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
        }

        /* 右上角语言按钮（原封不动） */
        .lang-btn {
            position: absolute;
            top: calc(24px + env(safe-area-inset-top));
            right: 24px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            z-index: 80;
        }

        /* 底部按钮外层：让它们各执一端，死贴两侧（原封不动） */
        .button-group {
            width: 100%;
            /* 缩减两侧边距，让按钮像原图一样极度贴边 */
            padding: 0 20px; 
            display: flex;
            justify-content: space-between;
            z-index: 80;
        }

        /* 按钮精确调校（原封不动） */
        .btn {
            /* 彻底砍掉宽度！固定成原图那种精巧的小短块 */
            width: 120px; 
            height: 48px; 
            border: none;
            /* 极小的微圆角 */
            border-radius: 6px; 
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            text-indent: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.1s ease;
        }

        .btn:active {
            opacity: 0.8;
        }

        /* 微信绿（原封不动） */
        .btn-login {
            background-color: #07C160;
            color: #FFFFFF;
        }

        /* 纯白（原封不动） */
        .btn-register {
            background-color: #FFFFFF;
            color: #191919;
        }

        /* 底部系统黑线（调高了不透明度，使其在黑色背景中隐约可见） */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            width: 134px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.35);
            border-radius: 100px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 80;
        }
    </style>
</head>
<body>

    <div class="status-bar">
        <div class="status-left">
            <span class="status-carrier" style="display: none;">中国移动</span>
            <span class="status-time" id="statusBarTime">00:00</span>
        </div>
        <div class="status-right">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <div class="battery-container">
                <div class="battery-icon">
                    <div id="battery-level" class="battery-level" style="width: 100%;"></div>
                </div>
                <div class="battery-tip"></div>
            </div>
        </div>
    </div>

    <div class="container" id="appContainer">
        <div class="lang-btn">语言</div>

        <div class="button-group">
            <button class="btn btn-login">登录</button>
            <button class="btn btn-register">注册</button>
        </div>

        <div class="home-indicator"></div>
    </div>

    <script>
        // ==================== 🕒 1. 高精度时间刷新与电池适配 ====================
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('statusBarTime').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function updateBattery() {
            try {
                const battery = await navigator.getBattery();
                const refreshBatteryUI = () => {
                    const level = Math.round(battery.level * 100);
                    document.getElementById('battery-level').style.width = level + '%';
                };
                refreshBatteryUI();
                battery.addEventListener('levelchange', refreshBatteryUI);
            } catch (e) {
                document.getElementById('battery-level').style.width = '100%';
            }
        }
        updateBattery();


        // ==================== 📲 2. 仿 iOS 全屏双向手势滑动返回桌面 ====================
        const appContainer = document.getElementById('appContainer');
        let startX = 0;
        let currentX = 0;
        let isDragging = false;
        let swipeDirection = ""; // "leftToRight" 或 "rightToLeft"

        // 返回主界面的函数
        function exitApp() {
            // 返回上一个页面（如果它是从 index.html 跳过来的话）
            if (document.referrer !== "") {
                window.location.href = "index.html";
            } else {
                // 如果是直接打开的独立页面，就调用默认的历史返回
                window.history.back();
            }
        }

        // 触控开始
        window.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            const screenWidth = window.innerWidth;
            
            // 边缘判定：允许靠近左边缘或右边缘的区域触发返回手势
            if (startX < 50) {
                isDragging = true;
                swipeDirection = "leftToRight";
                appContainer.style.transition = 'none'; // 滑动时取消动画跟随手指
            } else if (startX > screenWidth - 50) {
                isDragging = true;
                swipeDirection = "rightToLeft";
                appContainer.style.transition = 'none';
            }
        }, { passive: true });

        // 触控移动
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX;
            const screenWidth = window.innerWidth;
            let diffX = currentX - startX;

            if (swipeDirection === "leftToRight" && diffX > 0) {
                // 向右滑：界面往右平移，逐渐变透明
                appContainer.style.transform = `translateX(${diffX}px)`;
                appContainer.style.opacity = (1 - diffX / screenWidth).toFixed(2);
            } else if (swipeDirection === "rightToLeft" && diffX < 0) {
                // 向左滑：界面往左平移，逐渐变透明
                appContainer.style.transform = `translateX(${diffX}px)`;
                appContainer.style.opacity = (1 - Math.abs(diffX) / screenWidth).toFixed(2);
            }
        }, { passive: true });

        // 触控结束
        window.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            const screenWidth = window.innerWidth;
            let diffX = currentX - startX;
            const returnThreshold = 100; // 滑动超过 100px 就触发返回

            // 恢复顺滑的贝塞尔曲线动画
            appContainer.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease';

            if (swipeDirection === "leftToRight") {
                if (diffX > returnThreshold) {
                    // 超过阈值，完美划出屏幕并返回
                    appContainer.style.transform = `translateX(${screenWidth}px)`;
                    appContainer.style.opacity = '0';
                    setTimeout(exitApp, 300);
                } else {
                    // 未达到阈值，弹回原位
                    appContainer.style.transform = 'translateX(0px)';
                    appContainer.style.opacity = '1';
                }
            } else if (swipeDirection === "rightToLeft") {
                if (Math.abs(diffX) > returnThreshold) {
                    // 超过阈值，完美从左侧划出屏幕并返回
                    appContainer.style.transform = `translateX(-${screenWidth}px)`;
                    appContainer.style.opacity = '0';
                    setTimeout(exitApp, 300);
                } else {
                    // 未达到阈值，弹回原位
                    appContainer.style.transform = 'translateX(0px)';
                    appContainer.style.opacity = '1';
                }
            }
        });

        // ==================== 💻 3. 桌面端鼠标模拟滑动返回 ====================
        let isMouseDown = false;
        window.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            const screenWidth = window.innerWidth;
            if (startX < 50) {
                isMouseDown = true;
                swipeDirection = "leftToRight";
                appContainer.style.transition = 'none';
            } else if (startX > screenWidth - 50) {
                isMouseDown = true;
                swipeDirection = "rightToLeft";
                appContainer.style.transition = 'none';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            currentX = e.clientX;
            const screenWidth = window.innerWidth;
            let diffX = currentX - startX;

            if (swipeDirection === "leftToRight" && diffX > 0) {
                appContainer.style.transform = `translateX(${diffX}px)`;
                appContainer.style.opacity = (1 - diffX / screenWidth).toFixed(2);
            } else if (swipeDirection === "rightToLeft" && diffX < 0) {
                appContainer.style.transform = `translateX(${diffX}px)`;
                appContainer.style.opacity = (1 - Math.abs(diffX) / screenWidth).toFixed(2);
            }
        });

        window.addEventListener('mouseup', () => {
            if (!isMouseDown) return;
            isMouseDown = false;
            const screenWidth = window.innerWidth;
            let diffX = currentX - startX;
            const returnThreshold = 100;

            appContainer.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease';

            if (swipeDirection === "leftToRight") {
                if (diffX > returnThreshold) {
                    appContainer.style.transform = `translateX(${screenWidth}px)`;
                    appContainer.style.opacity = '0';
                    setTimeout(exitApp, 300);
                } else {
                    appContainer.style.transform = 'translateX(0px)';
                    appContainer.style.opacity = '1';
                }
            } else if (swipeDirection === "rightToLeft") {
                if (Math.abs(diffX) > returnThreshold) {
                    appContainer.style.transform = `translateX(-${screenWidth}px)`;
                    appContainer.style.opacity = '0';
                    setTimeout(exitApp, 300);
                } else {
                    appContainer.style.transform = 'translateX(0px)';
                    appContainer.style.opacity = '1';
                }
            }
        });
    </script>
</body>
</html>
