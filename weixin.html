<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none; 
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #111111; /* 修改底层色，彻底掐死黑杠 */
        }

        /* 核心修复：微信本身不再生成状态栏，而是让出空间（Placeholder），使外壳的状态栏能露出来 */
        .status-bar-placeholder {
            width: 100%;
            height: 44px; /* 标准 iOS 状态栏占位高度 */
            background-color: #111111; 
        }

        /* ==================== 2. 全局 App 弹性底框 ==================== */
        .app-container {
            width: 100%;
            height: 100%;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            transform-origin: center center;
            will-change: transform, opacity;
        }

        /* ==================== 3. 微信主导航栏 ==================== */
        .nav-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            background-color: #111111;
            border-bottom: 0.5px solid #222222;
        }

        .nav-left {
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #ffffff;
            cursor: pointer;
        }

        .nav-left i {
            font-size: 20px;
            margin-right: 6px;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
        }

        .nav-right i {
            font-size: 18px;
            color: #ffffff;
        }

        /* ==================== 4. 聊天内容流动区域 ==================== */
        .chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #191919;
            -webkit-overflow-scrolling: touch; 
        }

        /* 时间标签 */
        .chat-time {
            align-self: center;
            background-color: rgba(255, 255, 255, 0.08);
            color: #888888;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* 消息基础骨架 */
        .message-row {
            display: flex;
            align-items: flex-start;
            max-width: 85%;
        }

        /* 对方的消息（左边） */
        .msg-left {
            align-self: flex-start;
        }

        /* 我的消息（右边） */
        .msg-right {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        /* 头像 */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .msg-left .avatar {
            background-image: url('https://img.cdn1.vip/i/69fda8bde0be8f_1778231485.jpg');
            margin-right: 10px;
        }

        .msg-right .avatar {
            background-image: url('https://img.cdn1.vip/i/69fda8be2c02df_1778231486.jpg');
            margin-left: 10px;
        }

        /* 气泡 */
        .bubble {
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-all;
            position: relative;
        }

        .msg-left .bubble {
            background-color: #2c2c2e;
            color: #ffffff;
        }

        .msg-right .bubble {
            background-color: #07c160;
            color: #ffffff;
        }

        /* ==================== 5. 底部聊天工具栏 ==================== */
        .input-panel {
            height: 56px;
            background-color: #111111;
            border-top: 0.5px solid #222222;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            padding-bottom: env(safe-area-inset-bottom); /* 保护小黑条区域 */
        }

        .input-panel i {
            font-size: 24px;
            color: #cccccc;
        }

        .input-box {
            flex: 1;
            height: 38px;
            background-color: #2c2c2e;
            border-radius: 6px;
            border: none;
            padding: 0 10px;
            color: #ffffff;
            font-size: 15px;
        }

        .input-box:focus {
            outline: none;
        }
    </style>
</head>
<body>

    <div class="status-bar-placeholder"></div>

    <div class="app-container" id="appContainer">
        
        <div class="nav-bar">
            <div class="nav-left" id="navBackBtn">
                <i class="fas fa-chevron-left"></i>
                <span>雪兔</span>
            </div>
            <div class="nav-title">宝贝</div>
            <div class="nav-right">
                <i class="fas fa-ellipsis-h"></i>
            </div>
        </div>

        <div class="chat-content">
            <div class="chat-time">10:25</div>
            
            <div class="message-row msg-left">
                <div class="avatar"></div>
                <div class="bubble">你在干嘛呀？手机弄好了嘛？</div>
            </div>

            <div class="message-row msg-right">
                <div class="avatar"></div>
                <div class="bubble">正在调试最后的手势呢，有点头大 😭</div>
            </div>

            <div class="message-row msg-left">
                <div class="avatar"></div>
                <div class="bubble">加油加油！弄好了一起去吃好吃的！</div>
            </div>
        </div>

        <div class="input-panel">
            <i class="far fa-comment-dots"></i>
            <input type="text" class="input-box" placeholder="发送消息..." readonly>
            <i class="far fa-smile"></i>
            <i class="fas fa-plus-circle"></i>
        </div>

    </div>

    <script>
        // ==================== 📱 高仿 iOS 侧滑无缝返回核心交互 ====================
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let currentY = 0;
        let isDragging = false;
        let swipeDirection = ''; 

        const appContainer = document.getElementById('appContainer');
        const triggerDistance = window.innerWidth * 0.35; 

        function handleStart(e) {
            const touch = e.touches ? e.touches[0] : e;
            startX = touch.clientX;
            startY = touch.clientY;
            isDragging = true;
            swipeDirection = '';
            appContainer.style.transition = 'none'; 
        }

        function handleMove(e) {
            if (!isDragging) return;
            const touch = e.touches ? e.touches[0] : e;
            currentX = touch.clientX;
            currentY = touch.clientY;

            let deltaX = currentX - startX;
            let deltaY = currentY - startY;

            if (swipeDirection === '') {
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 10) {
                    swipeDirection = deltaX > 0 ? 'left-to-right' : 'right-to-left';
                } else if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 10) {
                    isDragging = false; 
                }
            }

            // 侧滑拉动时的动态弹性缩放视差动效
            if (swipeDirection === 'left-to-right' && deltaX > 0) {
                let moveFactor = deltaX;
                let scaleFactor = 1 - (deltaX / window.innerWidth) * 0.08;
                let opacityFactor = 1 - (deltaX / window.innerWidth) * 0.3;
                appContainer.style.transform = `translateX(${moveFactor}px) scale(${scaleFactor})`;
                appContainer.style.opacity = opacityFactor;
            } else if (swipeDirection === 'right-to-left' && deltaX < 0) {
                let moveFactor = deltaX;
                let scaleFactor = 1 - (Math.abs(deltaX) / window.innerWidth) * 0.08;
                let opacityFactor = 1 - (Math.abs(deltaX) / window.innerWidth) * 0.3;
                appContainer.style.transform = `translateX(${moveFactor}px) scale(${scaleFactor})`;
                appContainer.style.opacity = opacityFactor;
            }
        }

        function handleEnd() {
            if (!isDragging) return;
            isDragging = false;
            let deltaX = currentX - startX;

            appContainer.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease';

            if (swipeDirection === 'left-to-right' && deltaX > triggerDistance) {
                appContainer.style.transform = 'translateX(100%)';
                appContainer.style.opacity = '0';
                setTimeout(() => {
                    // 【核心修复】：不再调用 URL 刷新网页，而是发跨文档信号让父级 index.html 把自己滑下去
                    window.parent.postMessage('closeApp', '*');
                    setTimeout(() => { appContainer.style.transform = 'translateX(0px) scale(1)'; appContainer.style.opacity = '1'; }, 200);
                }, 300);
            } else if (swipeDirection === 'right-to-left' && Math.abs(deltaX) > triggerDistance) {
                appContainer.style.transform = 'translateX(-100%)';
                appContainer.style.opacity = '0';
                setTimeout(() => {
                    window.parent.postMessage('closeApp', '*');
                    setTimeout(() => { appContainer.style.transform = 'translateX(0px) scale(1)'; appContainer.style.opacity = '1'; }, 200);
                }, 300);
            } else {
                // 没拉到位，弹回
                appContainer.style.transform = 'translateX(0px) scale(1)';
                appContainer.style.opacity = '1';
            }
        }

        // 绑定触摸和鼠标事件
        window.addEventListener('touchstart', handleStart, { passive: true });
        window.addEventListener('touchmove', handleMove, { passive: true });
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        // 点击左上角返回按钮
        document.getElementById('navBackBtn').addEventListener('click', () => {
            appContainer.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease';
            appContainer.style.transform = 'translateY(100%)';
            setTimeout(() => {
                window.parent.postMessage('closeApp', '*');
                setTimeout(() => { appContainer.style.transform = 'translateX(0px) scale(1)'; appContainer.style.opacity = '1'; }, 100);
            }, 300);
        });
    </script>
</body>
</html>
