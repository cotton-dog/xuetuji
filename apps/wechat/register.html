<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>用手机号注册</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "HanziPen SC", "Wawati SC", "Comic Sans MS", cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffffff;
            color: #333;
        }

        /* ========== 注册主页面样式 ========== */
        .main-page {
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            padding: 20px 30px;
            margin: 0 auto;
            position: relative;
        }

        .close-btn {
            font-size: 24px;
            color: #333;
            cursor: pointer;
            font-weight: 300;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .title {
            text-align: center;
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .avatar-section {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .avatar-box {
            width: 60px;
            height: 60px;
            background-color: #e0e0e0;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom-right-radius: 15px; 
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .camera-icon {
            width: 30px;
            height: 30px;
            fill: #ffffff;
            position: absolute;
        }

        #avatar-input {
            display: none;
        }

        .form-group {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 16px;
            position: relative;
        }

        .form-label {
            width: 90px;
            color: #333;
            flex-shrink: 0;
        }

        .form-control {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            font-family: inherit;
        }
        
        .form-control::placeholder {
            color: #b2b2b2;
        }

        .readonly-select {
            color: #888;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .highlight-input {
            color: #333;
        }

        .footer-section {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .agreement {
            display: flex;
            align-items: flex-start;
            font-size: 12px;
            color: #b2b2b2;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: center;
            width: 100%;
            justify-content: center;
        }

        .agreement a {
            color: #5b6b92;
            text-decoration: none;
        }

        .custom-checkbox {
            display: none;
        }

        .checkbox-label {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid #c0c0c0;
            margin-right: 8px;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .custom-checkbox:checked + .checkbox-label {
            background-color: #07c160;
            border-color: #07c160;
        }

        .custom-checkbox:checked + .checkbox-label::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            top: 2px;
            left: 5px;
            transform: rotate(45deg);
        }

        .submit-btn {
            width: 100%;
            max-width: 300px;
            padding: 14px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn.disabled {
            background-color: #f2f2f2;
            color: #c0c0c0;
            pointer-events: none;
        }

        .submit-btn.active {
            background-color: #07c160;
            color: #ffffff;
            pointer-events: auto;
        }

        /* ========== 国家/地区选择页 (弹层) ========== */
        .country-picker-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #ebebeb;
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .normal-header {
            background-color: #f7f7f7;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            position: relative;
            justify-content: center;
            z-index: 2;
        }

        .normal-close-btn {
            font-size: 24px;
            color: #333;
            cursor: pointer;
            position: absolute;
            left: 15px;
            font-weight: 300;
        }

        .normal-title {
            font-size: 17px;
            color: #333;
        }

        .search-area {
            background-color: #ebebeb;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            z-index: 2;
        }

        .search-box-wrapper {
            flex: 1;
            background-color: #ffffff;
            border-radius: 6px;
            height: 36px;
            position: relative;
            overflow: hidden;
        }

        .fake-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b2b2b2;
            font-size: 15px;
            cursor: text;
        }

        .real-input-wrapper {
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            padding: 0 10px;
        }

        .search-icon-svg {
            width: 16px;
            height: 16px;
            fill: #b2b2b2;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .real-search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            font-family: inherit;
            caret-color: #07c160;
            padding: 0;
        }
        
        .real-search-input::placeholder {
            color: #b2b2b2;
        }

        .cancel-search-btn {
            font-size: 16px;
            color: #5b6b92;
            margin-left: 15px;
            cursor: pointer;
            display: none;
        }

        .country-list {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-right: 25px;
            scroll-behavior: smooth;
        }

        .list-group-title {
            padding: 4px 15px;
            font-size: 12px;
            color: #888;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            margin-left: 15px;
            padding-left: 0;
            border-bottom: 1px solid #e5e5e5;
            font-size: 16px;
            cursor: pointer;
        }
        
        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:active {
            background-color: #d9d9d9;
        }

        .item-code {
            color: #888;
        }

        /* 字母导航条样式更新 */
        .side-index {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #555;
            z-index: 101;
        }

        .side-index-item {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 1px 0;
            cursor: pointer;
            font-weight: 500;
        }

        /* 绿色实心高亮状态 */
        .side-index-item.active {
            background-color: #07c160;
            color: #ffffff;
        }

        .side-index-icon {
            width: 10px;
            height: 10px;
            fill: #555;
            margin-bottom: 2px;
            cursor: pointer;
        }

        .no-result {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 15px;
            display: none;
        }
    </style>
</head>

<div class="main-page">
    <div class="close-btn">✕</div>
    <h1 class="title">用手机号注册</h1>

    <div class="avatar-section">
        <label for="avatar-input" class="avatar-box" id="avatar-box">
            <svg class="camera-icon" id="camera-icon" viewBox="0 0 24 24">

            </svg>
            <img id="avatar-preview" src="" alt="头像">

        <input type="file" id="avatar-input" accept="image/*">
    </div>

    <div class="form-group">
        <div class="form-label">昵称</div>
        <input type="text" class="form-control" id="nickname" placeholder="请填写昵称">
    </div>

    <div class="form-group" id="open-picker-btn">
        <div class="form-label">国家/地区</div>
        <div class="readonly-select" id="selected-country-text">中国大陆 (+86)</div>
        <input type="hidden" id="country-code" value="+86">
    </div>

    <div class="form-group">
        <div class="form-label">手机号</div>
        <input type="tel" class="form-control highlight-input" id="phone" placeholder="请填写手机号码">
    </div>

    <div class="form-group">
        <div class="form-label">密码</div>
        <input type="password" class="form-control" id="password" placeholder="请设置密码">
    </div>

    <div class="footer-section">
        <div class="agreement">

        <button id="submit-btn" class="submit-btn disabled">同意并继续</button>

</div>

    const noResultTips = document.getElementById('no-result-tips');

    function renderCountryList(dataArray) {
        countryListContainer.innerHTML = '';
        if (dataArray.length === 0) {
            noResultTips.style.display = 'block';
            return;
        } else {
            noResultTips.style.display = 'none';
        }

        const groupedData = {};
        dataArray.forEach(item => {
            if (!groupedData[item.letter]) groupedData[item.letter] = [];
            groupedData[item.letter].push(item);
        });

        const sortedLetters = Object.keys(groupedData).sort();
        
        sortedLetters.forEach(letter => {
            const groupTitle = document.createElement('div');
            groupTitle.className = 'list-group-title';
            groupTitle.id = 'group-' + letter;
            groupTitle.innerText = letter;
            countryListContainer.appendChild(groupTitle);

            groupedData[letter].forEach(country => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'list-item';
                itemDiv.innerHTML = `<span>${country.name}</span><span class="item-code">${country.code}</span>`;
                itemDiv.addEventListener('click', () => selectCountry(country.name, country.code));
                countryListContainer.appendChild(itemDiv);
            });
        });
    }

    renderCountryList(globalCountryData);

    searchInput.addEventListener('input', function() {
        const keyword = this.value.trim().toLowerCase();
        if (keyword === '') {
            renderCountryList(globalCountryData);
            return;
        }
        const filteredData = globalCountryData.filter(country => {
            return country.name.includes(keyword) || country.code.includes(keyword);
        });
        renderCountryList(filteredData);
    });

    // ---------- 侧边栏索引高亮与滚动联动 ----------

        indexItems.forEach(item => {
            if (item.innerText === letter) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    }

        if (group) {
            group.scrollIntoView({ behavior: 'smooth' });

        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                avatarPreview.src = event.target.result;
                avatarPreview.style.display = 'block';
                cameraIcon.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    });

// 动态判断区号，严格限制位数并排版
phoneInput.addEventListener('input', function() {
    let code = countryCodeInput.value;
    // 获取当前国家的规则，找不到就用 default
    let rule = phoneValidationRules[code] || phoneValidationRules['default'];
    
    // 1. 过滤所有非数字字符（自动去掉用户乱敲的空格、括号等特殊符号）
    let rawValue = this.value.replace(/\D/g, ''); 
    
    // 2. 严格截断：超出该国最大位数的部分直接抛弃
    rawValue = rawValue.substring(0, rule.maxLength);
    
    // 3. 赋值回输入框（应用对应的排版格式）
    this.value = rule.format(rawValue);
    
    // 4. 每次输入都触发整体表单校验
    checkFormStatus();
});

function checkFormStatus() {
    const isNicknameFilled = nicknameInput.value.trim().length > 0;
    const isPasswordFilled = passwordInput.value.trim().length > 0;
    const isAgreed = agreeCheckbox.checked;

    // 获取当前选中的区号和纯数字手机号
    let code = countryCodeInput.value;
    let rawPhoneValue = phoneInput.value.replace(/\D/g, ''); 
    let rule = phoneValidationRules[code] || phoneValidationRules['default'];

    // 【核心】使用该国家的专属正则进行合法性校验
    const isPhoneValid = rule.isValid(rawPhoneValue);

    // 只有全部条件满足，按钮才激活
    if (isNicknameFilled && isPhoneValid && isPasswordFilled && isAgreed) {
        submitBtn.className = 'submit-btn active';
    } else {
        submitBtn.className = 'submit-btn disabled';
    }
}

    nicknameInput.addEventListener('input', checkFormStatus);
    passwordInput.addEventListener('input', checkFormStatus);
    agreeCheckbox.addEventListener('change', checkFormStatus);
const phoneValidationRules = {
    '+86': { 
        maxLength: 11, 
        // 3-4-4 排版
        format: (v) => v.length > 7 ? v.replace(/^(\d{3})(\d{4})(\d+)/, '$1 $2 $3') : (v.length > 3 ? v.replace(/^(\d{3})(\d+)/, '$1 $2') : v),
        // 大陆手机号正则：1开头，第二位3-9，共11位
        isValid: (v) => /^1[3-9]\d{9}$/.test(v) 
    },
    '+81': { 
        maxLength: 11, 
        // 3-4-4 排版
        format: (v) => v.length > 7 ? v.replace(/^(\d{3})(\d{4})(\d+)/, '$1 $2 $3') : (v.length > 3 ? v.replace(/^(\d{3})(\d+)/, '$1 $2') : v),
        // 日本手机号：通常070/080/090开头，共11位
        isValid: (v) => /^(070|080|090)\d{8}$/.test(v) 
    },
    '+1': { 
        maxLength: 10, 
        // 3-3-4 排版，中间用横杠连接
        format: (v) => v.length > 6 ? v.replace(/^(\d{3})(\d{3})(\d+)/, '$1-$2-$3') : (v.length > 3 ? v.replace(/^(\d{3})(\d+)/, '$1-$2') : v),
        // 北美手机号：10位纯数字
        isValid: (v) => /^\d{10}$/.test(v) 
    },
    // 默认通用兜底规则（针对你没写明规则的其他国家）
    'default': {
        maxLength: 15, 
        format: (v) => v.replace(/(.{4})/g, '$1 ').trim(),
        isValid: (v) => v.length >= 6 
    }
};
